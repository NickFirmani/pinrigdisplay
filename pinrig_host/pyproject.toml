[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinrig-host"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pinrig-protocol==0.1.0", "pyserial>=3.5"]

[project.scripts]
pinrig-host = "pinrig_host.server:main"

[tool.setuptools]
include-package-data = false
packages = ["pinrig_host"]
package-dir = {"pinrig_host" = "."}

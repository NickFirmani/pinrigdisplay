[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinrig-producers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pinrig-protocol==0.1.0"]

[project.optional-dependencies]
rig = ["pinrig-host==0.1.0"]
obs = ["websocket-client>=1.6,<2"]

[project.scripts]
pinrig-manager = "pinrig_producers.manager:main"
pinrig-rig = "pinrig_producers.rig:main"
pinrig-stream = "pinrig_producers.overview:main"
pinrig-obs = "pinrig_producers.obs:main"

[tool.setuptools]
include-package-data = false
packages = ["pinrig_producers"]
package-dir = {"pinrig_producers" = "."}

[tool.setuptools.package-data]
pinrig_producers = ["booth.html", "overview.html"]

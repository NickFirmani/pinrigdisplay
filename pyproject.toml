[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinrig-display-controller"
version = "0.1.0"
description = "LAN HTTP controller for an ST7796 display"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=9"]

[project.optional-dependencies]
hardware = ["spidev>=3.6", "rpi-lgpio>=0.6"]

[project.scripts]
display-controller = "display_controller.server:main"

[tool.setuptools.packages.find]
include = ["display_controller*"]

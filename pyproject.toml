[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinrig-artwork"
version = "0.1.0"
description = "Desktop artwork builder and preview for the Pico display"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=9", "pinrig-protocol==0.1.0"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["pinrig_artwork*"]

[tool.setuptools.package-data]
"pinrig_artwork" = ["assets/*.png"]

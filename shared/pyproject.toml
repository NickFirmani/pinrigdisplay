[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinrig-shared"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools]
include-package-data = false
packages = ["shared", "shared.display_contracts", "shared.release_manifests"]
package-dir = {"shared" = "."}
